<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Reveal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="gift-box" id="giftBox" onclick="openGift()">
            <img src="gift-box.png" alt="Gift Box" id="giftImage" />
        </div>
        <div class="letter" id="letter" style="display: none;">
            <div class="letter-content">
                <p>Hello! Here's your surprise letter with pretty pink decorations. Enjoy!</p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
